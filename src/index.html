<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2338bdf8'><path d='M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TrafficPulse-X — Smarter Traffic Intelligence</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script>
      (function() {
        var theme = new URLSearchParams(window.location.search).get('theme') || localStorage.getItem('tp_theme') || 'dark';
        if (theme === 'light') {
          document.documentElement.classList.remove('dark');
        } else {
          document.documentElement.classList.add('dark');
        }
        if (window.location.search.indexOf('skip_intro') !== -1 || window.location.search.indexOf('no_intro') !== -1) {
          try {
            sessionStorage.setItem('tp_intro_completed', 'true');
            localStorage.setItem('tp_intro_completed', 'true');
          } catch(e){}
        }
      })();
    </script>
  </head>
  <body class="bg-[#F4F7FB] dark:bg-[#06111D] text-slate-900 dark:text-[#F7FAFF] min-h-screen selection:bg-[#2F8CFF] selection:text-white">
    <div id="root"></div>
    <script type="module" src="./main.jsx"></script>
  </body>
</html>
